databases:
  - name: ai-lighthouse-db
    region: oregon
    plan: free
    databaseName: lighthouse
    user: lighthouse

services:
  - type: web
    name: ai-lighthouse-api
    env: node
    region: oregon
    plan: free
    buildCommand: bash scripts/render-build.sh
    startCommand: bash scripts/render-start.sh
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-lighthouse-db
          property: connectionString
      - key: OPENROUTER_API_KEY
        sync: false
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: REDIS_URL
        fromService:
          type: redis
          name: ai-lighthouse-kv
          property: connectionString
      - key: CRON_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_AUDIENCE_ID
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      - key: NEXT_PUBLIC_BASE_URL
        sync: false

  - type: redis
    name: ai-lighthouse-kv
    region: oregon
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
